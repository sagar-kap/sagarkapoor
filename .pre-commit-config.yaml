repos:
  ###################################################################
  # Generic pre-commit hooks
  ###################################################################
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args:
          - --maxkb=5000

  - repo: https://github.com/Weburz/crisp
    rev: v1.0.0
    hooks:
      - id: crisp
        name: lint git-commit messages

  ###################################################################
  # Hooks to QA the frontend source code for the Blog
  ###################################################################

  # Runs the project's own Prettier (same version, config and plugin as CI).
  # pnpm runs from website/, where the config and .prettierignore live, so the
  # repo-root-relative paths pre-commit passes get their "website/" stripped.
  - repo: local
    hooks:
      - id: prettier
        name: run Prettier on Front End source code
        language: system
        files: ^website/
        entry: bash -c 'pnpm --dir website exec prettier --write --ignore-unknown "${@#website/}"' --
