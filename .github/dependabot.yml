version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      timezone: "Europe/Sofia"
    labels:
      - "dependencies"
    assignees:
      - Sagar-Kap
    commit-message:
      prefix: "chore(deps): "
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 3

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      time: "08:00"
      timezone: "Europe/Sofia"
    labels:
      - "dependencies"
    assignees:
      - Sagar-Kap
    commit-message:
      prefix: "chore(deps): "
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3
